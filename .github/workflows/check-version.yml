name: check-version

on:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Check VERSION increment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check VERSION increment
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          version_re = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")

          def parse(value: str) -> tuple[int, int, int]:
              if not version_re.fullmatch(value):
                  raise SystemExit(f"invalid VERSION {value!r}; expected MAJOR.MINOR.PATCH")
              return tuple(int(part) for part in value.split("."))

          head = pathlib.Path("VERSION").read_text().strip()
          head_tuple = parse(head)
          base_sha = os.environ["BASE_SHA"]
          try:
              base = subprocess.check_output(
                  ["git", "show", f"{base_sha}:VERSION"],
                  stderr=subprocess.DEVNULL,
                  text=True,
              ).strip()
          except subprocess.CalledProcessError:
              print("base branch has no VERSION file; accepting initial versioned PR")
              sys.exit(0)
          base_tuple = parse(base)
          if head_tuple <= base_tuple:
              raise SystemExit(f"VERSION must increase relative to base branch: base={base}, head={head}")
          print(f"VERSION increased: {base} -> {head}")
          PY

      - name: Check migration immutability
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Applied migrations are immutable history: a migration file must be
          # byte-identical across PRs and never deleted — schema changes always
          # ship as a new NNNN+1 file. All migration streams live under
          # host/migrations/.
          #
          # One-time reset exception: Kern 1.0.0 collapsed the incremental host
          # migrations (0001-0017) into a single 0001_baseline.sql. That reset
          # merges into the pre-collapse main commit below, so bypass the check
          # for exactly that base. Every later PR branches from a base that
          # already contains the baseline, so its base differs and the check
          # below runs normally.
          MIGRATION_RESET_BASE_SHA="20b5713338c8f91643b65a52c2fb9a2f01b63e56"
          APP_PLATFORM_REMOVAL_BASE_SHA="d93a378d47b6413992078ae121cefb4dabd56516"
          WORKSPACE_MIGRATION_CONSOLIDATION_BASE_SHA="5717f1c4184a4b7ac838ee282e525bcc26d936bd"
          paths=(host/migrations/)
          if [ "${BASE_SHA}" = "${MIGRATION_RESET_BASE_SHA}" ]; then
            echo "migration immutability bypassed for the one-time Kern 1.0.0 baseline reset"
            exit 0
          fi
          if [ "${BASE_SHA}" = "${APP_PLATFORM_REMOVAL_BASE_SHA}" ]; then
            echo "migration immutability bypassed for the one-time generic app-platform removal"
            exit 0
          fi
          if [ "${BASE_SHA}" = "${WORKSPACE_MIGRATION_CONSOLIDATION_BASE_SHA}" ]; then
            echo "migration immutability bypassed for the one-time Workspace migration consolidation"
            exit 0
          fi
          # --no-renames: a replaced migration must report as D + A under its
          # real paths; rename detection can misattribute the violation.
          changed="$(git diff --name-only --no-renames --diff-filter=MD "${BASE_SHA}"...HEAD -- "${paths[@]}" || true)"
          if [ -n "${changed}" ]; then
            echo "migration files may only be added, never edited, renamed, or deleted:" >&2
            echo "${changed}" >&2
            exit 1
          fi
          added="$(git diff --name-only --no-renames --diff-filter=A "${BASE_SHA}"...HEAD -- "${paths[@]}" || true)"
          if [ -n "${added}" ]; then
            echo "new migration file(s):"
            echo "${added}"
          else
            echo "no migration changes"
          fi
