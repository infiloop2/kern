name: test-all-host

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suites:
    name: Host tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, browser]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    # Independent runners keep browser CPU/memory use out of database tests.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Verify locked host Node dependencies
        shell: bash
        run: |
          npm ci --prefix host/npm --omit=dev --ignore-scripts --no-fund --no-audit

      - name: Authenticate to GitHub Container Registry
        if: github.repository == 'infiversehq/kern'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Prepare sandbox image
        timeout-minutes: 12
        shell: bash
        run: bash .github/ci/prepare-sandbox.sh pull ghcr.io/infiversehq/kern-ci

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

      - name: Compile all sources in no-network sandbox
        if: matrix.suite == 'unit'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 -m py_compile $(find host tests -name "*.py")'

      - name: Run host type checks in no-network sandbox
        if: matrix.suite == 'unit'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 -m mypy --config-file mypy.ini && python3 -m pyright --project pyrightconfig.json'

      - name: Run unit tests in no-network sandbox
        if: matrix.suite == 'unit'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 -m unittest discover -s tests -v'

      - name: Run admin UI smoke in no-network sandbox
        if: matrix.suite == 'browser'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/smoke-ui/admin_ui_smoke.py --port 3100 --webkit'

  test:
    # Preserve the branch-protection check name. Skipped, cancelled, and failed
    # suites must never turn the aggregate green.
    name: Run all host tests
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every suite to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: test "$SUITES_RESULT" = success
