name: test-all-host

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run all host tests
    runs-on: ubuntu-latest
    # A cold image build/export plus the full test suite can exceed 15 minutes.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Verify locked host Node dependencies
        shell: bash
        run: |
          npm ci --prefix host/npm --omit=dev --ignore-scripts --no-fund --no-audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build CI sandbox image
        timeout-minutes: 12
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/sandbox.Dockerfile
          tags: kern-ci:${{ github.run_id }}
          load: true
          cache-from: type=gha,scope=kern-ci
          cache-to: type=gha,scope=kern-ci,mode=max

      - name: Compile all sources in no-network sandbox
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:${{ github.run_id }} \
            'python3 -m py_compile $(find host tests -name "*.py")'

      - name: Run host type checks in no-network sandbox
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:${{ github.run_id }} \
            'python3 -m mypy --config-file mypy.ini && python3 -m pyright --project pyrightconfig.json'

      - name: Run unit tests in no-network sandbox
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:${{ github.run_id }} \
            'python3 -m unittest discover -s tests -v'

      - name: Run admin UI smoke in no-network sandbox
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:${{ github.run_id }} \
            'python3 tests/smoke-ui/admin_ui_smoke.py --port 3100 --webkit'
