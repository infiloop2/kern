name: test-all-host

# PR updates run dependency-free syntax/JSON/action-pin preflight before expensive tests.
# Private PR suites wait for a clean current-head Codex comment. run-reviewed-ci
# starts the deferred run once, preserving its merge ref and required check names.
# Public PR suites remain automatic; public main pushes always select every suite.
# Private main never runs this suite automatically. October guards remain in every paid private job.
# On restoration, remove pause guards only; retain review dependencies and aggregate checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/kern-ci

# Superseded tests for the same PR cancel independently of other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Cheap checks and review gate
    # October pause: remove only the leading false guard in the November 1 PR.
    if: false && github.repository == 'infiversehq/kern' && github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted CI policy
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          path: .ci-policy
          persist-credentials: false
      - name: Checkout the original test revision as data
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: source
          persist-credentials: false
      - name: Run dependency-free preflight
        run: python3 .ci-policy/.github/ci/preflight.py --root source
      - name: Check current Codex verdict
        if: github.event_name == 'pull_request'
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .ci-policy/.github/ci/check_review.py gate
      # This deliberate failure keeps required validation incomplete. A clean
      # review starts this deferred run once; later retries use GitHub Re-run jobs.
      # Before merging, the agent must recheck the latest review and all findings.
      - name: Wait for clean Codex review
        if: steps.review.outputs.ready == 'false'
        run: |
          echo '::notice::Waiting for clean Codex review; final CI will start automatically once. Later retries use GitHub Re-run jobs.'
          exit 1

  select:
    needs: review
    # October pause: remove only the repository-name guard in the November 1 PR.
    # Main pushes permanently run only in public repositories.
    if: >-
      always() && github.repository != 'infiversehq/kern' &&
      (github.event_name == 'pull_request' || github.event.repository.private == false) &&
      (github.repository != 'infiversehq/kern' || needs.review.result == 'success')
    name: Select host test suites
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run dependency-free preflight on public CI
        if: github.repository != 'infiversehq/kern'
        run: python3 .github/ci/preflight.py
      - name: Select PR suites or every suite on public main
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python3 .github/ci/select_tests.py --all
          else
            python3 .github/ci/select_tests.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  suites:
    # October pause: remove only the repository-name guard in the November 1 PR.
    # Public CI skips review; override skip propagation through select while
    # still requiring a valid matrix and honoring workflow cancellation.
    if: >-
      always() && !cancelled() && needs.select.result == 'success' &&
      github.repository != 'infiversehq/kern' &&
      (github.event_name == 'pull_request' || github.event.repository.private == false)
    name: Host tests (${{ matrix.suite }})
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    # Separate runners isolate browser CPU/memory from Python/database work.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Verify locked host Node dependencies
        shell: bash
        run: |
          npm ci --prefix host/npm --omit=dev --ignore-scripts --no-fund --no-audit

      - name: Pull sandbox image with temporary registry credentials
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No checkout-controlled helper or build runs until these credentials
          # are destroyed. A cache miss falls back in the next, credential-free step.
          started=$SECONDS
          echo 'TIMING start sandbox-registry-pull'
          dependency_hash="$(sha256sum .github/ci/sandbox.Dockerfile .github/ci/requirements.txt | sha256sum | cut -d ' ' -f 1)"
          registry_config_dir="$(mktemp -d "${RUNNER_TEMP}/kern-ci-registry.XXXXXX")"
          cleanup() {
            rm -rf "$registry_config_dir"
            echo "TIMING end sandbox-registry-pull: $((SECONDS - started))s"
          }
          trap cleanup EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$registry_config_dir" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          if ! docker --config "$registry_config_dir" pull "${CI_REGISTRY_IMAGE}:deps-${dependency_hash}"; then
            echo '::notice::Authenticated image pull missed; preparing dependencies without registry credentials.'
          fi

      - name: Prepare sandbox image without registry credentials
        shell: bash
        run: python3 tests/scripts/time_group.py sandbox-preparation bash .github/ci/prepare-sandbox.sh pull "$CI_REGISTRY_IMAGE"

      - name: Compile all sources in no-network sandbox
        if: matrix.suite == 'python'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/scripts/time_group.py compilation python3 -m py_compile $(find host tests -name "*.py")'

      - name: Run host type checks in no-network sandbox
        if: matrix.suite == 'python'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/scripts/time_group.py mypy python3 -m mypy --config-file mypy.ini && python3 tests/scripts/time_group.py pyright python3 -m pyright --project pyrightconfig.json'

      - name: Run unit tests in no-network sandbox
        if: matrix.suite == 'python'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/scripts/time_group.py python-unit python3 -m unittest discover -s tests -v'

      - name: Run admin UI core smoke in no-network sandbox
        if: matrix.suite == 'admin-ui'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/scripts/time_group.py admin-ui python3 tests/smoke-ui/admin_ui_smoke.py --port 3100 --scope core'

      - name: Run admin UI workspace and WebKit smoke in no-network sandbox
        if: matrix.suite == 'workspace-ui'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/scripts/time_group.py workspace-ui python3 tests/smoke-ui/admin_ui_smoke.py --port 3100 --scope workspaces --webkit'

      - name: Run native browser integration in no-network sandbox
        if: matrix.suite == 'native-browser'
        shell: bash
        run: |
          .github/ci/run-in-sandbox.sh kern-ci:sandbox \
            'python3 tests/smoke-ui/native_browser_smoke.py'

  test:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    name: Run all host tests
    needs: [review, select, suites]
    # October pause: remove only the repository-name guard in the November 1 PR.
    if: >-
      always() && github.repository != 'infiversehq/kern' &&
      (github.event_name == 'pull_request' || github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require selection and every selected suite to pass
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          REPOSITORY: ${{ github.repository }}
          SELECT_RESULT: ${{ needs.select.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          if [ "$REPOSITORY" = infiversehq/kern ]; then test "$REVIEW_RESULT" = success; fi
          test "$SELECT_RESULT" = success
          test "$SUITES_RESULT" = success
      - name: Checkout trusted final review policy
        if: github.repository == 'infiversehq/kern' && github.event_name == 'pull_request'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify review and PR head/base are still current
        if: github.repository == 'infiversehq/kern' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/check_review.py verify
