<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect X · Kern</title><link rel="stylesheet" href="/admin_ui.css"></head>
<body class="browser-popup">
  <main>
    <header class="browser-toolbar"><div><h1 id="browser-title">Connect X</h1><p id="browser-message" role="status">Opening your private browser…</p></div><div class="browser-buttons"><button id="browser-home">X home</button><button id="browser-save" class="primary" disabled>Save and close</button><button id="browser-cancel">Close</button></div></header>
    <p id="browser-origin" class="browser-origin">Opening X…</p>
    <p id="browser-frame-error" role="status" hidden></p>
    <p class="muted">Click or tap a field in the X screen to select it. Type directly on desktop. On a phone, use the text bar below the screen. Complete verification yourself, then save. Agent actions for this account are paused while you have control.</p>
    <div class="browser-screen-wrap"><img id="browser-screen" tabindex="0" alt="Interactive remote website browser" draggable="false" hidden></div>
    <section class="browser-typing"><label class="field">Type in selected X field<input id="browser-text" type="password" autocomplete="off" spellcheck="false" placeholder="Text or password"></label>
      <div class="browser-buttons"><button id="browser-insert">Send text</button><button id="browser-tab">Tab</button><button id="browser-enter">Enter</button></div>
    </section>
    <button id="browser-refresh">Reload page</button>
  </main>
  <script type="module" src="/admin_ui/browser_popup.js"></script>
</body></html>
